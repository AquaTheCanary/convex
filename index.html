<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Convex</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,Tahoma,Geneva,Verdana,sans-serif;
}

body{
    background:#0f172a;
    color:white;
}

header{
    padding:20px 10%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:20px;
}

.hero{
    min-height:80vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:20px;
}

.hero h1{
    font-size:4rem;
    margin-bottom:20px;
}

.hero p{
    max-width:600px;
    opacity:.8;
    font-size:1.2rem;
    margin-bottom:30px;
}

.btn{
    background:#3b82f6;
    color:white;
    text-decoration:none;
    padding:15px 30px;
    border-radius:10px;
    transition:.3s;
}

.btn:hover{
    background:#2563eb;
}

.features{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    padding:80px 10%;
}

.card{
    background:#1e293b;
    padding:25px;
    border-radius:15px;
}

.card h3{
    margin-bottom:10px;
}

footer{
    text-align:center;
    padding:30px;
    opacity:.6;
}
</style>
</head>

<body>

<header>
    <div class="logo">Convex</div>

    <nav>
        Home</a>
        Features</a>
        Contact</a>
    </nav>
</header>

<section class="hero">
    <h1>Build Something Amazing</h1>
    <p>
        Welcome to Convex. A simple, modern and fast website hosted for free.
    </p>

    Coming soon...</a>
</section>
    
<footer>
    © 2026 Convex. All rights reserved.
</footer>

</body>
</html>
